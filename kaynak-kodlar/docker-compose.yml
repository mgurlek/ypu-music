services:
  spotdl-ui:
    build: .
    image: spotdl-ui:latest
    container_name: spotdl-ui
    # init: reaps the child processes (spotdl, ffmpeg) so none are left behind as zombies.
    init: true
    ports:
      # Only this computer can open the app. Without "127.0.0.1:" everyone on your Wi-Fi could.
      - "127.0.0.1:3000:3000"
    volumes:
      # Downloaded music is saved in the "Indirilen-Muzikler" folder on your computer, not lost inside Docker.
      - ../Indirilen-Muzikler:/app/downloads
